name = "avto-reshenie"
main = "src/index.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://serg1306.github.io"
# Бесплатные ИИ-запросы: с одного устройства за всё время; с одного IP и всего на сервис — в день
FREE_PER_DEVICE = "3"
LIMIT_PER_IP = "15"
LIMIT_TOTAL = "100"
# Годовая подписка
PRICE_RUB = "300"
PAID_PER_YEAR = "10"
APP_URL = "https://serg1306.github.io/avto-reshenie/"
# Т-Банк: ключ терминала из личного кабинета; пароль терминала — секретом TBANK_PASSWORD
TBANK_TERMINAL_KEY = ""
TBANK_TAXATION = "usn_income"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
